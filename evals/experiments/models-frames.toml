# The model sweep: every hosted image-output model on OpenRouter (the live
# /api/v1/models list — google and openai ids). Cadence stays at provider
# defaults so the image model is the only variable — this answers "which
# model draws the most faithful frames with real motion" before cadence is
# tuned. Hosted-only by decision (2026-10-08): no Runway, no local
# open-weights arms — everything runs through OpenRouter/OpenAI.
#
# Run from the repo root:
#   uv run python -m evals.imagegen run evals/experiments/models-frames.toml
# Probe cheaply first with --limit 4.
# Model ids rot upstream — re-check the live list before a big run; the
# manifest records the resolved id either way.

name = "models-frames"
mode = "video-animation"
duration = 4.0
panels = ["samples/kenja-ch0/page-07.jpg", "samples/kenja-ch0/page-09.jpg"]
context = "Kenja no Mago chapter 0: rain begins over a mountain valley as a hooded stranger approaches; in town, a young man freezes, sensing imminent danger."
judge = true

# --- OpenRouter image models (all ten with image output, 2026-10-07) ---------

[[arms]]
name = "gemini-3.1-flash-lite"
provider = "openrouter"
model = "google/gemini-3.1-flash-lite-image"

[[arms]]
name = "gpt-5-image-mini"
provider = "openrouter"
model = "openai/gpt-5-image-mini"

[[arms]]
name = "gemini-2.5-flash-image"
provider = "openrouter"
model = "google/gemini-2.5-flash-image"  # the provider default (baseline)

[[arms]]
name = "gemini-3.1-flash-image"
provider = "openrouter"
model = "google/gemini-3.1-flash-image"

[[arms]]
name = "gemini-3.1-flash-image-preview"
provider = "openrouter"
model = "google/gemini-3.1-flash-image-preview"

[[arms]]
name = "nano-banana-2.1"
provider = "openrouter"
model = "google/gemini-nano-banana-2.1"

[[arms]]
name = "gpt-5-image"
provider = "openrouter"
model = "openai/gpt-5-image"

[[arms]]
name = "gemini-3-pro-image"
provider = "openrouter"
model = "google/gemini-3-pro-image"

[[arms]]
name = "gemini-3-pro-image-preview"
provider = "openrouter"
model = "google/gemini-3-pro-image-preview"

[[arms]]
name = "gpt-5.4-image-2"
provider = "openrouter"
model = "openai/gpt-5.4-image-2"
