# Build the macOS app and attach the DMG to a GitHub Release when a v* tag is pushed.
#
# The DMG is published under the stable asset name EntertainmentHarness-macOS-arm64.dmg
# so the website's releases/latest/download/... permalink keeps working across versions.
#
# Note: first runs may need debugging (PyInstaller + Electrobun on a clean runner,
# ~320 MB artifact). Fallback: build locally with `cd ui && bun run package` and
# `gh release create <tag> ui/artifacts/<dmg>`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          cd ui && bun install --frozen-lockfile

      - name: Build frozen backend
        run: cd ui && bun run build:backend

      - name: Gate: frozen backend imports + TTS smoke
        # Catches packaging regressions (e.g. espeak-ng data dir) before the
        # app is bundled. --check-tts synthesizes one line through Kokoro.
        run: |
          ui/resources/backend/eh-serve/eh-serve --check-imports
          ui/resources/backend/eh-serve/eh-serve --check-tts

      - name: Gate: TTS smoke from a deep install path
        # espeak-ng stores its data path in a ~160-byte fixed buffer and
        # silently falls back to a bogus compiled-in path beyond that; the
        # shallow build path above is short enough to hide it. Re-run the
        # smoke test from a deep path so the gate covers real installs.
        run: |
          DEEP="$RUNNER_TEMP/$(python3 -c 'print("d"*140)')/app"
          mkdir -p "$DEEP"
          cp -R ui/resources/backend/eh-serve "$DEEP/eh-serve"
          "$DEEP/eh-serve/eh-serve" --check-tts

      - name: Build app + DMG
        run: cd ui && bunx electrobun build --env=stable

      - name: Stage release asset (stable name)
        run: |
          mkdir -p release-assets
          cp ui/artifacts/stable-macos-arm64-EntertainmentHarness.dmg \
             release-assets/EntertainmentHarness-macOS-arm64.dmg

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/EntertainmentHarness-macOS-arm64.dmg
