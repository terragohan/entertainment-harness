[project]
name = "entertainment-harness"
version = "0.1.0"
description = "A local-first entertainment system: media library, recap generator, and video pipeline"
authors = [
    { name = "Terra Gohan" }
]
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COMMONS-CLAUSE.md"]
readme = "README.md"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.28.0",
    "kokoro-onnx>=0.6.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "ddgs>=9.0",
    "youtube-transcript-api>=1.0",
    "boto3>=1.28",
    "tomlkit>=0.15.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
eh = "entertainment_harness.cli:app"

[project.urls]
Homepage = "https://terragohan.com"
Repository = "https://github.com/terragohan/entertainment-harness"
Documentation = "https://github.com/terragohan/entertainment-harness/tree/main/docs"
Issues = "https://github.com/terragohan/entertainment-harness/issues"

[project.optional-dependencies]
dataset = [
    "accelerate>=1.14.0",
    "json-repair>=0.63.4",
    "torchvision>=0.28.0",
    "transformers>=5.16.1",
]
sam = [
    "segment-anything",
    "torch>=2.13.0",
]
qwen3 = [
    "mlx-audio>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.uv.sources]
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }
